name: Luxe Go2RTC CI

on:
  push:
    branches:
      - luxe/hlc7
      - luxe/recording-manager-dev
  pull_request:
    branches:
      - luxe/hlc7
      - luxe/recording-manager-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js for browser POC checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OPFS POC does not buffer files
        run: |
          node --check www/recording-poc.js
          node --check www/recording-opfs-poc.js
          node --check www/recording-opfs-worker.js
          node --check www/recording-opfs-sw.js
          node --check www/recording-opfs-relay-worker.js
          node --check www/recording-opfs-wkdownload-poc.js
          ! grep -Eqi 'new[[:space:]]+Blob|createObjectURL|arrayBuffer[(]' www/recording-opfs-poc.js www/recording-opfs-worker.js www/recording-opfs-sw.js www/recording-opfs-relay-worker.js www/recording-opfs-wkdownload-poc.js
      - name: Test affected packages
        run: go test -count=1 ./internal/recording ./pkg/h265 ./pkg/iso ./pkg/mp4 ./pkg/xiaomi/miss/...
      - name: Race-test parallel recording sessions
        run: go test -race -count=1 ./internal/recording ./pkg/mp4
      - name: Build all packages
        run: go build ./...
      - name: Build Linux AMD64 binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/go2rtc-linux-amd64 .
          sha256sum dist/go2rtc-linux-amd64 > dist/SHA256SUMS.txt
      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-luxe-hl7-linux-amd64
          path: dist/*
