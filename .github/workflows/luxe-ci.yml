name: Luxe Go2RTC CI

on:
  push:
    branches:
      - luxe/hlc7
  pull_request:
    branches:
      - luxe/hlc7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Camera wall connection gate regression
        run: |
          node --check www/luxe-camera-wall.js
          node tests/luxe-camera-wall-controls-ready.test.cjs
          node tests/luxe-camera-wall-connect-recovery.test.cjs
          node tests/luxe-camera-wall-unified-recording.test.cjs
      - name: Test affected packages
        run: go test -count=1 ./internal/luxerecord ./internal/mp4 ./pkg/h265 ./pkg/iso ./pkg/mp4 ./pkg/xiaomi/miss/...
      - name: Build all packages
        run: go build ./...
      - name: Build Linux AMD64 binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/go2rtc-linux-amd64 .
          cp www/luxe-camera-wall.js dist/luxe-camera-wall.js
          cp docs/luxe-camera-wall-official-upgrade-1.9.15-luxe.3.md dist/INSTALL-luxe-1.9.15-luxe.3.md
          cp docs/luxe-camera-wall-v1.1.2-connect-recovery.md dist/INSTALL-camera-wall-v1.1.2.md
          sha256sum dist/go2rtc-linux-amd64 dist/luxe-camera-wall.js > dist/SHA256SUMS.txt
      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-luxe-1.9.15-luxe.3-ha-ingress-no-secret
          path: dist/*

      - name: Upload camera-wall v1.1.2 only
        uses: actions/upload-artifact@v4
        with:
          name: luxe-camera-wall-v1.1.2-connect-recovery
          path: |
            dist/luxe-camera-wall.js
            dist/INSTALL-camera-wall-v1.1.2.md
