name: Luxe Go2RTC CI

on:
  push:
    branches:
      - luxe/hlc7
  pull_request:
    branches:
      - luxe/hlc7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Test affected packages
        run: go test -count=1 ./pkg/h265 ./pkg/iso ./pkg/mp4 ./pkg/xiaomi/miss/...
      - name: Build all packages
        run: go build ./...
      - name: Build Linux AMD64 binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/go2rtc-linux-amd64 .
          sha256sum dist/go2rtc-linux-amd64 > dist/SHA256SUMS.txt
      - name: Upload Linux AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-luxe-hl7-linux-amd64
          path: dist/*
