name: Luxe Xiaomi Recording RC - Isolated HAOS Build

on:
  push:
    branches:
      - feat/luxe-xiaomi-recording-release-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integrated HLC7 recording branch
        uses: actions/checkout@v4
      - name: Check UI syntax and standalone HAOS app
        run: |
          set -eu
          bash -n packaging/haos-luxe-recording-rc/run.sh
          grep -Fx 'ingress_entry: "luxe-xiaomi-recorder-rc.html"' packaging/haos-luxe-recording-rc/config.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("www/luxe-xiaomi-recorder-rc.html").read_text()
          match=re.search(r"<script>(.*?)</script>",html,re.DOTALL)
          if not match: raise SystemExit("missing recorder JS")
          Path("/tmp/luxe-recorder-rc.js").write_text(match.group(1))
          for item in ["navigator.share", "ready_at", "expires_at", "confirm", "ack/"]:
              if item not in html: raise SystemExit(f"missing state interface: {item}")
          PY
          node --check /tmp/luxe-recorder-rc.js
          node tests/luxe-recording-rc-flow.test.cjs
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Test new recording manager and existing media compatibility
        run: |
          go test -count=1 ./internal/luxerecord
          go test -count=1 ./pkg/h265 ./pkg/iso ./pkg/mp4 ./pkg/xiaomi/miss/... ./internal/mp4
      - name: Compile all production HLC7 packages with new module
        run: go build ./...
      - name: Build standalone Linux AMD64 candidate
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/go2rtc-luxe-recording-rc-amd64 .
          sha256sum dist/go2rtc-luxe-recording-rc-amd64 > dist/SHA256SUMS.txt
      - name: Smoke test embedded test UI via HTTP
        run: |
          set -eu
          cat >/tmp/recording-rc-smoke.yaml <<'EOF'
          app:
            modules:
              - api
              - luxe_recording
          api:
            listen: "127.0.0.1:1984"
          luxe_recording:
            enabled: true
            secret: "ci-only-test-key-32-characters-ABC"
            directory: "/tmp/luxe-rc-smoke-cache"
          EOF
          ./dist/go2rtc-luxe-recording-rc-amd64 -c /tmp/recording-rc-smoke.yaml >/tmp/recorder-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:1984/luxe-xiaomi-recorder-rc.html -o /tmp/luxe-rc.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/recorder-smoke.log;exit 1;fi
          grep -Fq 'Luxe Xiaomi Camera' /tmp/luxe-rc.html
          code="$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/api/luxe/recordings/)"
          test "$code" = 401
          curl --silent --show-error --fail -H "X-Luxe-Record-Key: ci-only-test-key-32-characters-ABC" \
            http://127.0.0.1:1984/api/luxe/recordings/ -o /tmp/recorder-list.json
          python3 - <<'PY'
          import json
          with open("/tmp/recorder-list.json") as f: data=json.load(f)
          assert data["retention_seconds"] == 900, data
          assert data["max_duration_seconds"] == 1800, data
          assert data["sessions"] == [], data
          PY
      - name: Assemble isolated HAOS local test app
        run: |
          set -eu
          mkdir -p staging/luxe_xiaomi_record_rc
          cp packaging/haos-luxe-recording-rc/config.yaml staging/luxe_xiaomi_record_rc/
          cp packaging/haos-luxe-recording-rc/Dockerfile staging/luxe_xiaomi_record_rc/
          cp packaging/haos-luxe-recording-rc/run.sh staging/luxe_xiaomi_record_rc/
          cp dist/go2rtc-luxe-recording-rc-amd64 staging/luxe_xiaomi_record_rc/go2rtc
          chmod +x staging/luxe_xiaomi_record_rc/go2rtc
          tar -C staging -czf dist/luxe-xiaomi-recording-rc-local-app-amd64.tar.gz luxe_xiaomi_record_rc
          sha256sum dist/luxe-xiaomi-recording-rc-local-app-amd64.tar.gz >> dist/SHA256SUMS.txt
          tar tzf dist/luxe-xiaomi-recording-rc-local-app-amd64.tar.gz | grep -F 'luxe_xiaomi_record_rc/config.yaml'
          tar tzf dist/luxe-xiaomi-recording-rc-local-app-amd64.tar.gz | grep -F 'luxe_xiaomi_record_rc/go2rtc'
      - name: Upload separate test artifact (not a formal release)
        uses: actions/upload-artifact@v4
        with:
          name: luxe-xiaomi-recording-rc-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          retention-days: 7
